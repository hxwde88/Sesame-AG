name: Build Upstream Tag APK

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '请输入上游官方的 Tag 名称 (例如 4249-v1.0.0)'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出你自己的仓库
        uses: actions/checkout@v4

      - name: 添加上游仓库并拉取官方指定 Tag 代码
        run: |
          git remote add upstream https://github.com/Sesame-AG/Sesame-AG.git
          git fetch upstream --tags
          git checkout ${{ github.event.inputs.upstream_tag }}

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 赋予构建脚本权限
        run: chmod +x gradlew

      - name: 编译 Release 版 APK
        run: ./gradlew assembleRelease --no-daemon

      - name: 使用你的密钥自动签名
        id: sign_app
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: 保存签名后的 APK 到你的发布页面 (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: my-build-${{ github.event.inputs.upstream_tag }}
          name: 自动构建上游版本 ${{ github.event.inputs.upstream_tag }}
          # 关键修改：直接抓取 release 目录下所有签名好的 .apk 安装包
          files: app/build/outputs/apk/release/*-signed.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
